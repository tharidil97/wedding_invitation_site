<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%" fill="none">
  <!-- Groom running towards right -->
  <defs>
    <filter id="shadowG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4a3b58" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadowG)">
    <!-- Head & Hair -->
    <ellipse cx="95" cy="40" rx="14" ry="16" fill="#fcd7b8"/>
    <!-- Hair -->
    <path d="M82,38 C80,24 95,20 108,24 C112,28 111,36 108,40 C104,33 90,32 82,38 Z" fill="#3b2820"/>
    <!-- Face profile -->
    <circle cx="102" cy="40" r="2" fill="#3b2820"/>
    <path d="M98,47 Q103,50 106,47" stroke="#b86b55" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Suit Torso leaning forward in sprint -->
    <path d="M72,56 L112,62 L106,112 L70,105 Z" fill="#4a3b58"/>
    <!-- White shirt collar & lavender tie -->
    <polygon points="90,58 98,59 95,78 92,78" fill="#ffffff"/>
    <polygon points="93,62 97,63 99,84 95,89 91,84" fill="#9d84b7"/>
    <!-- Lavender Boutonniere -->
    <ellipse cx="104" cy="72" rx="3.5" ry="5" fill="#8466a2"/>
    <circle cx="105" cy="70" r="2" fill="#d4af37"/>

    <!-- Back Arm swinging back -->
    <path d="M74,65 L50,82 L35,76" stroke="#4a3b58" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="75" r="5" fill="#fcd7b8"/>

    <!-- Front Arm reaching forward to bride -->
    <path d="M102,68 L126,82 L145,74" stroke="#4a3b58" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="147" cy="73" r="5" fill="#fcd7b8"/>

    <!-- Left Leg (driving forward) -->
    <path d="M95,108 L115,142 L138,155" stroke="#372a44" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe -->
    <ellipse cx="144" cy="157" rx="8" ry="4" transform="rotate(15 144 157)" fill="#231b2c"/>

    <!-- Right Leg (pushing back) -->
    <path d="M78,107 L60,135 L42,166" stroke="#4a3b58" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe -->
    <ellipse cx="38" cy="170" rx="8" ry="4" transform="rotate(-35 38 170)" fill="#231b2c"/>
  </g>
</svg>
