<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 40" width="100%" height="100%" fill="none">
  <!-- Center decorative diamond -->
  <polygon points="150,12 158,20 150,28 142,20" fill="#d4af37"/>
  <circle cx="150" cy="20" r="3" fill="#6e5287"/>

  <!-- Left side horizontal line with taper -->
  <line x1="20" y1="20" x2="135" y2="20" stroke="#bba6d2" stroke-width="1.2"/>
  <circle cx="132" cy="20" r="2" fill="#d4af37"/>
  <circle cx="20" cy="20" r="1.5" fill="#bba6d2"/>

  <!-- Left floral sprig -->
  <path d="M125,16 Q120,10 115,14 Q122,17 125,16 Z" fill="#7a917b"/>
  <ellipse cx="120" cy="11" rx="3" ry="2" transform="rotate(-30 120 11)" fill="#9d84b7"/>

  <!-- Right side horizontal line with taper -->
  <line x1="165" y1="20" x2="280" y2="20" stroke="#bba6d2" stroke-width="1.2"/>
  <circle cx="168" cy="20" r="2" fill="#d4af37"/>
  <circle cx="280" cy="20" r="1.5" fill="#bba6d2"/>

  <!-- Right floral sprig -->
  <path d="M175,16 Q180,10 185,14 Q178,17 175,16 Z" fill="#7a917b"/>
  <ellipse cx="180" cy="11" rx="3" ry="2" transform="rotate(30 180 11)" fill="#9d84b7"/>
</svg>
