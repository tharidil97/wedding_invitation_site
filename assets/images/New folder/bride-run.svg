<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="100%" height="100%" fill="none">
  <!-- Bride running towards left -->
  <defs>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7a6291" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3eff8"/>
    </linearGradient>
    <linearGradient id="veilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e2d8ee" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadowB)">
    <!-- Flowing wedding veil billowing behind -->
    <path d="M95,36 C135,30 155,55 175,90 C155,100 130,80 110,65 Z" fill="url(#veilGrad)"/>
    <path d="M100,40 C145,45 165,85 178,135 C150,130 125,105 105,75 Z" fill="url(#veilGrad)"/>

    <!-- Head & Hair -->
    <ellipse cx="88" cy="42" rx="13" ry="15" fill="#fcd7b8"/>
    <!-- Flowing Hair -->
    <path d="M82,34 C78,25 96,22 104,26 C112,32 118,50 126,62 C116,60 102,48 98,42 Z" fill="#4d2f1f"/>
    <!-- Tiara / Flower crown -->
    <path d="M82,32 Q90,28 98,32" stroke="#d4af37" stroke-width="2.5" fill="none"/>
    <circle cx="85" cy="30" r="2" fill="#9d84b7"/>
    <circle cx="90" cy="28" r="2.5" fill="#d4af37"/>
    <circle cx="95" cy="30" r="2" fill="#9d84b7"/>

    <!-- Face profile -->
    <circle cx="81" cy="42" r="2" fill="#3b2820"/>
    <path d="M78,48 Q82,51 86,49" stroke="#c45d6f" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Wedding Gown Corset -->
    <path d="M77,58 L104,60 L98,96 L76,92 Z" fill="url(#dressGrad)" stroke="#e4daf0" stroke-width="1"/>

    <!-- Back Arm swinging back -->
    <path d="M100,64 L120,78 L136,72" stroke="#fcd7b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Front Arm reaching out to groom holding bouquet -->
    <path d="M78,65 L56,76 L35,70" stroke="#fcd7b8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lavender Floral Bouquet -->
    <g transform="translate(24, 62)">
      <circle cx="8" cy="6" r="6" fill="#9d84b7"/>
      <circle cx="14" cy="4" r="5" fill="#bba6d2"/>
      <circle cx="5" cy="11" r="5" fill="#6e5287"/>
      <circle cx="11" cy="12" r="6" fill="#ffffff"/>
      <path d="M10,16 L14,24" stroke="#5f7560" stroke-width="3" stroke-linecap="round"/>
      <!-- Ribbon trailing -->
      <path d="M12,18 C16,22 18,28 22,32" stroke="#d4af37" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Flowing Wedding Dress Skirt (in motion) -->
    <path d="M76,92 Q62,130 42,165 C68,170 105,168 135,160 Q115,120 98,96 Z" fill="url(#dressGrad)" stroke="#ded2eb" stroke-width="1"/>
    <!-- Lace hem waves -->
    <path d="M42,165 Q65,160 88,166 Q112,158 135,160" stroke="#c8b5dc" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

    <!-- Legs & bridal heels peaking out -->
    <path d="M68,145 L58,168" stroke="#fcd7b8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="56" cy="172" rx="6" ry="3" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
    <path d="M92,142 L108,162" stroke="#fcd7b8" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="112" cy="165" rx="6" ry="3" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
  </g>
</svg>
